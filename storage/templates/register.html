<section class="mx-auto max-w-lg rounded-lg border border-stone-200 bg-white p-6">
  <h1 class="text-xl font-semibold">배우 등록</h1>
  <p class="mt-2 text-sm text-stone-600">MDL 숫자 id만 넣는다. 주소에 붙은 영문 이름은 조회키가 아니다.</p>
  {{error}}
  <form method="post" action="/register" class="mt-6 space-y-4" onsubmit="const button = this.querySelector('button'); button.textContent = '수집 중'; setTimeout(() => { button.disabled = true; }, 0);">
    <label class="block text-sm font-medium" for="mdl_id">MDL 숫자 id</label>
    <input id="mdl_id" name="mdl_id" required inputmode="text" placeholder="70935" class="w-full rounded-md border border-stone-300 px-3 py-2 text-sm outline-none focus:border-stone-900">
    <p class="text-xs text-stone-500">예: 70935, 70935-freen-sarocha-chankimha, 인물 주소. 앞 숫자만 저장한다.</p>
    <button type="submit" class="rounded-md bg-stone-900 px-4 py-2 text-sm font-medium text-white hover:bg-stone-700 disabled:bg-stone-400">수집</button>
  </form>
</section>
