name: glow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: glow
      POSTGRES_PASSWORD: glow
      POSTGRES_DB: glow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glow -d glow"]
      interval: 2s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"

  app:
    build: ./storage
    profiles: ["collect"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./storage/.env
    environment:
      DATABASE_URL: postgresql://glow:glow@postgres:5432/glow
      KURYANA_BASE_URL: https://kuryana.tbdh.app

  storage:
    build: ./storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./storage/.env
    environment:
      DATABASE_URL: postgresql://glow:glow@postgres:5432/glow
      KURYANA_BASE_URL: https://kuryana.tbdh.app
    command: ["serve"]

  hub:
    build: ./hub
    ports:
      - "3300:3300"
    environment:
      NUXT_STORAGE_URL: http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - storage

volumes:
  pgdata:
